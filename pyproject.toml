[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shibuya-scramble-lab"
version = "0.5.0"
description = "渋谷スクランブル交差点・個別エージェントのトイモデル（予測ではありません）"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT (code); OSM data ODbL; PLATEAU data CC BY 4.0"}
dependencies = []

[project.scripts]
shibuya-scramble-lab = "asagaya_town_sim.cli:main"
asagaya-town-sim = "asagaya_town_sim.cli:main"  # compatibility alias

[tool.hatch.build.targets.wheel]
packages = ["src/asagaya_town_sim"]

[tool.hatch.build.targets.sdist]
exclude = ["prototype", "docs"]
