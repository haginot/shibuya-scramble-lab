name: Build and deploy static Pages
# Enable Pages with GitHub Actions after the repository is public.
# This workflow does not enable Pages or change repository visibility.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - run: node --experimental-vm-modules web3d/sol/verify.mjs
      - run: node --experimental-vm-modules web3d/astra/check.mjs
      - run: node --experimental-vm-modules web3d/promo/verify.mjs
      - run: python tools/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
